<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Header</title>
  <link rel="stylesheet" href="mainpage.css">
</head>
<body>
  <header>
    <div class="logo">
      Ani<span>Flix</span>
    </div>
    <nav>
      <a href="#">Trang chủ</a>
      <a href="#">Anime</a>
      <a href="#">Thể loại</a>
      <a href="#">Lịch chiếu</a>
      <a href="#">Top anime</a>
    </nav>
    <div class="right">
      <div class="search-box">
        🔍
        <input type="text" placeholder="Tìm anime...">
      </div>
      <button class="login-btn">
    </div>
  </header>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 30px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px;
    }

    /* Ẩn thanh scroll */
    .carousel::-webkit-scrollbar {
      display: none;
    }

    .item {
      min-width: 200px;
      height: 120px;
      background: #333;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: 0.3s;
    }

    .item:hover {
      transform: scale(1.05);
      background: #555;
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 50%;
      z-index: 10;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .btn-left {
      left: 5px;
    }

    .btn-right {
      right: 5px;
    }
  </style>
</head>

<body>
  <h2>Danh sách phim</h2>

  <div class="carousel-container">
    <button class="btn btn-left" onclick="scrollLeft()">&#10094;</button>

    <div class="carousel" id="carousel">
      <div class="item">Phim 1</div>
      <div class="item">Phim 2</div>
      <div class="item">Phim 3</div>
      <div class="item">Phim 4</div>
      <div class="item">Phim 5</div>
      <div class="item">Phim 6</div>
      <div class="item">Phim 7</div>
      <div class="item">Phim 8</div>
      <div class="item">Phim 9</div>
      <div class="item">Phim 10</div>
    </div>

    <button class="btn btn-right" onclick="scrollRight()">&#10095;</button>
  </div>
  w
  <script>
    const carousel = document.getElementById("carousel");

    function scrollLeft() {
      carousel.scrollLeft -= 300; // lướt trái 300px
    }

    function scrollRight() {
      carousel.scrollLeft += 300; // lướt phải 300px
    }
  </script>
</body>
</html>
