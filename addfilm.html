<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lưu tên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0 10px 0;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #4285f4;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #357ae8;
    }
    .back-btn {
      background-color: #6c757d;
      margin-top: 20px;
    }
    .back-btn:hover {
      background-color: #5a6268;
    }
    #nameList {
      list-style: none;
      padding: 0;
    }
    #nameList li {
      padding: 10px;
      margin: 5px 0;
      background-color: #f0f0f0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h2>Lưu thông phim vào Firestore</h2>
  <p>Xin chào: <span id="userEmail"></span></p>
  <label for="posterInput">Poster</label>
  <input type="file" id="posterInput" />
  <label for="nameInput">tên phim</label>
  <input id="nameInput" placeholder="Nhập tên phim">

  <label for="genreInput">thể loại</label>
  <input id="genreInput" placeholder="Nhập thể loại">

  <label for="countryInput">quốc gia</label>
  <input id="countryInput" placeholder="Nhập quốc gia">

  <label for="durationInput">thời lượng</label>
  <input id="durationInput" placeholder="Nhập thời lượng">

  <label for="ratingInput">rating</label>
  <input id="ratingInput" placeholder="Nhập rating">


  <button onclick="saveName()">Lưu thông tin</button>

  <h3>Danh sách phim lưu trong hệ thống:</h3>

  <ul id="nameList"></ul>
  
  <script type="module" src="addfilm.js"></script>
  

  <button class="back-btn" onclick="goBack()">Quay lại</button>
  
</body>
</html>
